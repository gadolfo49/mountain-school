<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mountain Family | Mountain Creativity School</title>
<style>
:root{--blue:#064A89;--sky:#2A8CCB;--gold:#F9AB15;--green:#49AD33;--ink:#17324A;--muted:#6D8193;--bg:#F4F8FC;--paper:#fff;--line:#DCE7F0;--danger:#C94141;--shadow:0 10px 30px rgba(6,74,137,.09)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 14px}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px}.brandmark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--sky));color:white;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}.brand h1{font-size:17px;margin:0;color:var(--blue)}.brand small{color:var(--gold);font-weight:800}.role{margin-left:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 10px;color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:18px 14px 96px}.hero{background:linear-gradient(135deg,#064A89,#0C74B9);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;background:rgba(249,171,21,.18);border-radius:50%;right:-85px;top:-95px}.hero h2{position:relative;margin:0;font-size:27px}.hero p{position:relative;margin:7px 0 0;line-height:1.5;color:#E8F4FD}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.mt{margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(31,72,107,.04)}.metric strong{display:block;font-size:26px;color:var(--blue)}.metric span{font-size:11px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionhead h3{margin:0;font-size:17px}.sectionhead p{margin:3px 0 0;font-size:11px;color:var(--muted)}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.primary{background:var(--blue);color:#fff}.gold{background:var(--gold);color:#4B3300}.soft{background:#EAF5FC;color:var(--blue)}.danger{background:#FFF0F0;color:#A72E2E}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 10px;text-align:left;color:var(--ink)}.quick b{display:block;margin-top:6px;font-size:11px}.routine{display:grid;gap:8px}.r{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:#FBFDFF}.r.now{background:#EDF8FF;border-color:#9FD4F2;box-shadow:inset 4px 0 0 var(--sky)}.rt{font-size:9px;font-weight:900;color:var(--blue)}.rn{font-size:11px;font-weight:800}.rd{font-size:9px;color:var(--muted);margin-top:3px}.pill{font-size:8px;font-weight:900;border-radius:999px;padding:5px 7px;background:#EEF4F8;color:#567087}.pill.now{background:#FFF2CC;color:#8A5B00}.student{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px}.avatar{width:42px;height:42px;border-radius:13px;background:#EAF5FC;display:grid;place-items:center;color:var(--blue);font-weight:900}.student b{font-size:11px}.student small{display:block;color:var(--muted);margin-top:2px}.ok{color:#2F8622;font-weight:900}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:10px;font-weight:800;color:#63788B}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.crece{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pillar{border-radius:15px;padding:12px;color:#fff;min-height:110px}.pillar b{font-size:28px;display:block}.pillar strong{font-size:10px;display:block}.pillar small{font-size:8px;line-height:1.35;opacity:.9}.p1{background:#F2A11B}.p2{background:#1A8F63}.p3{background:#2A8CCB}.p4{background:#D94D4D}.p5{background:#6C56A8}.feed{display:grid;gap:0}.event{display:grid;grid-template-columns:34px 1fr;gap:9px;padding-bottom:14px}.dot{width:34px;height:34px;border-radius:11px;background:#EAF5FC;display:grid;place-items:center}.event b{font-size:11px}.event p{font-size:10px;color:var(--muted);margin:3px 0 0}.hidden{display:none!important}.notice{background:#F7FBFE;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:10px;color:#536F84;line-height:1.5}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:25;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom))}.bottom button{border:0;background:#fff;color:#6B7F91;border-radius:10px;padding:7px 2px;font-size:8px}.bottom button span{display:block;font-size:18px}.bottom button.active{background:#EAF5FC;color:var(--blue)}.modal{position:fixed;inset:0;background:rgba(10,30,45,.48);z-index:50;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{width:min(680px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h3{margin:0 0 12px}.field{margin-top:10px}.field label{font-size:9px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#17324A;color:#fff;padding:10px 13px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:10px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.g4,.g3,.g2{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.crece{grid-template-columns:1fr 1fr}.pillar:last-child{grid-column:1/-1}.r{grid-template-columns:72px 1fr}.r .pill{grid-column:2}.role{max-width:120px}.wrap{padding-top:13px}.hero h2{font-size:23px}}@media(min-width:900px){.bottom{left:50%;right:auto;width:600px;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin"><div class="brandmark">🏔️</div><div class="brand"><h1>Mountain Family</h1><small>Mountain Creativity School</small></div><select class="role" id="role"><option value="admin">Administrador</option><option value="teacher">Maestra</option><option value="family">Familia</option></select></div></header>
<main class="wrap">
<section id="homeView"></section>
<section id="routineView" class="hidden"></section>
<section id="academicView" class="hidden"></section>
<section id="messagesView" class="hidden"></section>
<section id="moreView" class="hidden"></section>
</main>
<nav class="bottom"><button class="active" data-view="home"><span>⌂</span>Inicio</button><button data-view="routine"><span>◷</span>Jornada</button><button data-view="academic"><span>✦</span>CRECE</button><button data-view="messages"><span>✉</span>Mensajes</button><button data-view="more"><span>☰</span>Más</button></nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var students=[{name:'Claire M.',level:'Infantes',present:true,time:'7:18 a. m.',diaper:true},{name:'Ethan M.',level:'Párvulos',present:true,time:'7:06 a. m.',diaper:true},{name:'Sofía R.',level:'Pre-Kinder',present:true,time:'7:31 a. m.',diaper:false},{name:'Samuel P.',level:'Kinder',present:false,time:'—',diaper:false},{name:'Amanda G.',level:'Párvulos',present:true,time:'7:42 a. m.',diaper:true},{name:'Lucas V.',level:'Kinder',present:true,time:'8:04 a. m.',diaper:false}];
var routine=[['6:20','6:30','Llegada del personal','Preparación, higiene y seguridad del aula.'],['6:30','8:00','Recepción y bienvenida','Recepción personalizada y juego libre supervisado.'],['8:00','8:20','Desayuno','Alimentación, higiene y preparación de clases.'],['8:30','8:50','Ceremonia de entrada','Acto cívico, reflexión y plan del día.'],['8:50','9:20','Círculo de la mañana','Asistencia, clima, tema y vocabulario bilingüe.'],['9:20','9:55','Actividad pedagógica','Actividad diferenciada según nivel.'],['9:55','10:00','Primer cambio de pañal','Obligatorio para quienes utilizan pañal.'],['10:00','10:15','Recreo','Juego exterior supervisado.'],['10:15','10:50','Grupo grande y pequeño','Trabajo autónomo e individualizado.'],['10:50','11:30','Actividad rotativa','Arte, literatura, música, psicomotricidad o expresión corporal.'],['11:30','11:50','Evaluación del día','Cierre, emociones y organización.'],['11:50','12:00','Segundo cambio de pañal','Cambio, manos y agua.'],['12:00','12:30','Almuerzo','Alimentación y autonomía.'],['12:30','14:30','Siesta / descanso','Descanso prolongado con supervisión.'],['14:30','15:00','Tercer cambio + higiene','Higiene al despertar.'],['15:00','15:30','Merienda','Merienda saludable.'],['15:30','17:00','Taller creativo','Rotación semanal de talleres.'],['17:00','18:00','Preparación y entrega','Higiene final y entrega a personas autorizadas.']];
var role='admin', currentView='home';
try{role=localStorage.getItem('mf-role')||'admin'}catch(e){}
$('#role').value=role;
function minutes(t){var p=t.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10)}
function currentRoutine(){var d=new Date(),m=d.getHours()*60+d.getMinutes(),i;for(i=0;i<routine.length;i++){if(m>=minutes(routine[i][0])&&m<minutes(routine[i][1]))return i}return -1}
function metric(v,l){return '<div class="card metric"><strong>'+v+'</strong><span>'+l+'</span></div>'}
function initials(n){return n.split(' ').map(function(x){return x.charAt(0)}).join('').slice(0,2)}
function studentList(){return students.map(function(s){return '<div class="student"><div class="avatar">'+initials(s.name)+'</div><div><b>'+s.name+'</b><small>'+s.level+' · '+(s.present?'Llegó '+s.time:'Ausente hoy')+'</small></div><span class="'+(s.present?'ok':'')+'">'+(s.present?'✓':'—')+'</span></div>'}).join('')}
function nowCard(){var i=currentRoutine();if(i<0)return '<div class="notice">La rutina escolar regular ha finalizado por hoy. Mañana la aplicación volverá a acompañar automáticamente la jornada desde las 6:20 a. m.</div>';var r=routine[i];return '<div class="r now"><div class="rt">'+r[0]+'–'+r[1]+'</div><div><div class="rn">'+r[2]+'</div><div class="rd">'+r[3]+'</div></div><span class="pill now">EN CURSO</span></div>'}
function renderHome(){var present=students.filter(function(s){return s.present}).length, html='';if(role==='family'){html='<div class="hero"><h2>Buenas tardes, familia de Claire 👋</h2><p>Todo lo importante de su hija en Mountain Creativity School, en un solo lugar.</p></div><div class="grid g3 mt">'+metric('7:18','Hora de llegada')+metric('3','Fotos nuevas')+metric('1 h 24 m','Descanso')+'</div><div class="card mt"><div class="sectionhead"><div><h3>Hoy en Mountain</h3><p>Diario de Claire</p></div></div><div class="feed"><div class="event"><div class="dot">✓</div><div><b>7:18 a. m. · Llegada</b><p>Entrada registrada con persona autorizada.</p></div></div><div class="event"><div class="dot">🍳</div><div><b>8:06 a. m. · Desayuno</b><p>Comió la mayor parte.</p></div></div><div class="event"><div class="dot">🎨</div><div><b>9:32 a. m. · Actividad CRECE</b><p>Exploración sensorial y reconocimiento de colores.</p></div></div></div></div>'}else if(role==='teacher'){html='<div class="hero"><h2>Mi Aula · Infantes</h2><p>La aplicación muestra primero lo que corresponde hacer ahora para reducir trabajo administrativo.</p></div><div class="grid g3 mt">'+metric(present,'Presentes')+metric(students.filter(function(s){return s.diaper}).length,'Usan pañal')+metric('0','Pendientes críticos')+'</div><div class="card mt"><div class="sectionhead"><div><h3>Ahora</h3><p>Rutina institucional</p></div></div>'+nowCard()+'</div><div class="card mt"><div class="sectionhead"><div><h3>Registro rápido</h3><p>Uno o dos toques</p></div></div><div class="quick"><button data-action="meal">🍲<b>Comida</b></button><button data-action="diaper">🍼<b>Pañal</b></button><button data-action="nap">😴<b>Siesta</b></button><button data-action="photo">📷<b>Foto</b></button></div></div>'}else{html='<div class="hero"><h2>Centro de mando Mountain</h2><p>Estudiantes, aulas, seguridad, comunicaciones y operación diaria de Mountain Creativity School.</p></div><div class="grid g4 mt">'+metric(students.length,'Estudiantes')+metric(present,'Presentes')+metric('3','Mensajes nuevos')+metric('1','Incidencia abierta')+'</div><div class="grid g2 mt"><div class="card"><div class="sectionhead"><div><h3>Momento actual</h3><p>Rutina automática</p></div></div>'+nowCard()+'</div><div class="card"><div class="sectionhead"><div><h3>Acciones rápidas</h3><p>Operaciones frecuentes</p></div></div><div class="quick"><button data-action="attendance">🔐<b>Entrada / salida</b></button><button data-action="incident">🩺<b>Incidencia</b></button><button data-action="message">💬<b>Mensaje</b></button><button data-action="payment">RD$<b>Pago</b></button></div></div></div><div class="card mt"><div class="sectionhead"><div><h3>Estudiantes</h3><p>Vista rápida de la jornada</p></div></div>'+studentList()+'</div>'}$('#homeView').innerHTML=html;bindActions()}
function renderRoutine(){var idx=currentRoutine();$('#routineView').innerHTML='<div class="card"><div class="sectionhead"><div><h3>Rutina diaria Mountain</h3><p>6:20 a. m. – 6:00 p. m.</p></div></div><div class="routine">'+routine.map(function(r,i){return '<div class="r '+(i===idx?'now':'')+'"><div class="rt">'+r[0]+'–'+r[1]+'</div><div><div class="rn">'+r[2]+'</div><div class="rd">'+r[3]+'</div></div><span class="pill '+(i===idx?'now':'')+'">'+(i===idx?'EN CURSO':i<idx?'FINALIZADO':'PROGRAMADO')+'</span></div>'}).join('')+'</div></div>'}
function renderAcademic(){var html='<div class="hero"><h2>Método CRECE</h2><p>Currículo dominicano + Método CRECE + Block Building como columna vertebral académica de Mountain Creativity School.</p></div><div class="crece mt"><div class="pillar p1"><b>C</b><strong>Creatividad y Construcción</strong><small>Imaginación, Block Building, solución de problemas.</small></div><div class="pillar p2"><b>R</b><strong>Ritmo y Movimiento</strong><small>Percusión corporal, coordinación, música y danza.</small></div><div class="pillar p3"><b>E</b><strong>Exploración y Curiosidad</strong><small>Experimentar, observar, preguntar y descubrir.</small></div><div class="pillar p4"><b>C</b><strong>Conexión y Comunicación</strong><small>Lenguaje, empatía, colaboración y expresión emocional.</small></div><div class="pillar p5"><b>E</b><strong>Equilibrio y Autonomía</strong><small>Independencia, autocuidado, decisiones y responsabilidad.</small></div></div><div class="grid g2 mt"><div class="card"><div class="sectionhead"><div><h3>Planificación inteligente</h3><p>Diseñada para el método propio de Mountain</p></div></div><div class="notice">Tema → competencia del currículo dominicano → pilar CRECE → estrategia → actividad → evidencia → evaluación formativa.</div><button class="btn primary mt" data-action="plan">Crear planificación CRECE</button></div><div class="card"><div class="sectionhead"><div><h3>Block Building</h3><p>Construcción como herramienta pedagógica</p></div></div><div class="notice">Torres, puentes, figuras, ciudades, construcción colaborativa y retos según edad; con observación de creatividad, percepción espacial, coordinación, planificación y resolución de problemas.</div></div></div>';$('#academicView').innerHTML=html;bindActions()}
function renderMessages(){$('#messagesView').innerHTML='<div class="card"><div class="sectionhead"><div><h3>Comunicación institucional</h3><p>Aula · Dirección · Enfermería · Pagos</p></div><button class="btn primary" data-action="message">Nuevo</button></div><div class="student"><div class="avatar">A</div><div><b>Aula Infantes</b><small>Actualización pedagógica de Claire</small></div><span class="pill now">1</span></div><div class="student mt"><div class="avatar">D</div><div><b>Dirección</b><small>Documentación recibida correctamente</small></div><span class="pill">Leído</span></div><div class="student mt"><div class="avatar">P</div><div><b>Pagos</b><small>Mensualidad septiembre registrada</small></div><span class="pill">Leído</span></div></div>';bindActions()}
function renderMore(){$('#moreView').innerHTML='<div class="grid g2"><div class="card"><h3>🔐 Entrada y salida</h3><p class="notice">Preparado para QR, NFC, PIN y verificación visual de personas autorizadas.</p><button class="btn soft" data-action="attendance">Abrir</button></div><div class="card"><h3>🩺 Incidencias y enfermería</h3><p class="notice">Registro formal, seguimiento y revisión administrativa.</p><button class="btn soft" data-action="incident">Registrar</button></div><div class="card"><h3>📈 Desarrollo infantil</h3><p class="notice">Lenguaje, cognición, socioemocional, motricidad, matemáticas, lectoescritura, inglés y creatividad.</p></div><div class="card"><h3>💰 Pagos</h3><p class="notice">Control de pagos y balances en pesos dominicanos.</p><button class="btn soft" data-action="payment">Registrar</button></div><div class="card"><h3>📄 Documentos</h3><p class="notice">Expediente digital, consentimientos y firmas.</p></div><div class="card"><h3>🚨 Mountain Safety</h3><p class="notice">Base para protocolos de sismo, incendio y verificación de todos los estudiantes.</p></div></div>';bindActions()}
function showView(v){currentView=v;['home','routine','academic','messages','more'].forEach(function(x){$('#'+x+'View').classList.toggle('hidden',x!==v)});$$('.bottom button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===v)});if(v==='home')renderHome();if(v==='routine')renderRoutine();if(v==='academic')renderAcademic();if(v==='messages')renderMessages();if(v==='more')renderMore();window.scrollTo(0,0)}
function openSheet(title,body){$('#sheet').innerHTML='<h3>'+title+'</h3>'+body+'<div class="mt"><button class="btn soft" id="closeSheet">Cerrar</button></div>';$('#modal').classList.add('show');$('#closeSheet').onclick=closeSheet}
function closeSheet(){$('#modal').classList.remove('show')}
function toast(t){var x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1800)}
function bindActions(){$$('[data-action]').forEach(function(b){b.onclick=function(){var a=b.getAttribute('data-action');if(a==='meal')openSheet('Registrar comida','<div class="field"><label>Grupo</label><select><option>Toda el aula</option><option>Seleccionar estudiantes</option></select></div><div class="field"><label>Resultado</label><select><option>Comió todo</option><option>Mayor parte</option><option>Poco</option><option>No comió</option></select></div><button class="btn primary mt" onclick="document.getElementById(\'modal\').classList.remove(\'show\');document.getElementById(\'toast\').textContent=\'Comida registrada\';document.getElementById(\'toast\').classList.add(\'show\');setTimeout(function(){document.getElementById(\'toast\').classList.remove(\'show\')},1800)">Guardar</button>');else if(a==='diaper')openSheet('Cambio de pañal','<div class="field"><label>Estudiantes con pañal</label><select><option>Todos</option><option>Claire</option><option>Ethan</option><option>Amanda</option></select></div><div class="field"><label>Tipo</label><select><option>Mojado</option><option>Evacuación</option><option>Mixto</option><option>Seco</option></select></div><button class="btn primary mt" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">Guardar</button>');else if(a==='nap')openSheet('Siesta','<div class="notice">Inicia o finaliza la siesta para todo el grupo y luego modifica únicamente las excepciones.</div><button class="btn primary mt" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">Iniciar para el grupo</button>');else if(a==='photo')openSheet('Foto / evidencia','<div class="notice">La versión de producción conectará cámara, selección de estudiantes y almacenamiento privado.</div>');else if(a==='attendance')openSheet('Entrada / salida segura','<div class="field"><label>Estudiante</label><select>'+students.map(function(s){return '<option>'+s.name+'</option>'}).join('')+'</select></div><div class="field"><label>Método</l
