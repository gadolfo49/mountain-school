<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064A89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mountain Family">
<meta name="description" content="Mountain Family · Mountain Creativity School">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles-v2.css">
<title>Mountain Family</title>
</head>
<body>
<div id="auth" class="auth"><div class="authbox"><div class="row"><img class="brand-logo" src="assets/mountain-logo-192.png" alt="Mountain Creativity School"><div class="brand"><b>Mountain Family</b><small>Mountain Creativity School</small></div></div><h2>Bienvenido</h2><p class="notice">Acceso privado para familias, maestras y administración.</p><div class="field"><label>CORREO</label><input id="email" type="email" autocomplete="email" inputmode="email"></div><div class="field"><label>CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password"></div><div class="row mt"><button id="loginBtn" class="btn primary">Iniciar sesión</button></div><p id="authMsg"></p></div></div>
<header class="top"><div class="topin"><img class="brand-logo" src="assets/mountain-logo-192.png" alt="Mountain"><div class="brand"><b>Mountain Family</b><small>Mountain Creativity School</small></div><div class="spacer"></div><span id="userChip" class="chip">Acceso privado</span><button id="logoutBtn" class="btn soft hidden">Salir</button></div></header>
<main class="wrap"><section id="home"></section><section id="routine" class="hidden"></section><section id="academic" class="hidden"></section><section id="messages" class="hidden"></section><section id="more" class="hidden"></section></main>
<nav class="bottom" aria-label="Navegación"><button class="active" data-view="home"><span>⌂</span>Inicio</button><button data-view="routine"><span>◷</span>Jornada</button><button data-view="academic"><span>✦</span>CRECE</button><button data-view="messages"><span>✉</span>Comunicación</button><button data-view="more"><span>☰</span>Más</button></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-v2.js"></script>
</body>
</html>
