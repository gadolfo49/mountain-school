async function saveForm(action){if(state.demo){toast('Guardado en modo demostración');$('#modal').classList.remove('show');return}try{if(action==='newStudent'){let level=$('#fLevel').value,{data:rooms}=await sb.from('mf_classrooms').select('id,level').eq('level',level).limit(1),{error}=await sb.from('mf_students').insert({first_name:$('#fName').value.trim(),last_name:$('#fLast').value.trim(),classroom_id:rooms?.[0]?.id||null});if(error)throw error;await loadData();renderHome()}else if(action==='safety'){let map={earthquake:'Sismo',fire:'Incendio',lockdown:'Resguardo',medical:'Emergencia médica',drill:'Simulacro'},t=$('#fSafety').value,{error}=await sb.from('mf_safety_events').insert({event_type:t,title:map[t],created_by:state.user.id});if(error)throw error}else if(action==='incident'){let {error}=await sb.from('mf_incidents').insert({student_id:$('#fStudent').value,incident_type:'general',description:$('#fDetail').value.trim()||'Incidencia registrada',created_by:state.user.id});if(error)throw error}else{let types={meal:'meal',diaper:'diaper',nap:'nap',activity:'activity'},{error}=await sb.from('mf_daily_events').insert({student_id:$('#fStudent').value,event_type:types[action],summary:$('#fDetail').value.trim()||'Registro realizado',visible_to_family:true,created_by:state.user.id});if(error)throw error}toast('Registro guardado');$('#modal').classList.remove('show')}catch(e){toast(e.message||'No se pudo guardar')}}
function bindActions(){$$('[data-action]').forEach(b=>b.onclick=()=>openForm(b.dataset.action))}
async function loadData(){if(state.demo){state.students=demoStudents;return}let {data,error}=await sb.from('mf_students').select('id,first_name,last_name,uses_diaper,allergies,medications,food_restrictions,mf_classrooms(level)');let students=error?[]:(data||[]).map(x=>({...x,level:x.mf_classrooms?.level||'Sin nivel',present:false}));if(students.length){let start=new Date();start.setHours(0,0,0,0);let {data:att}=await sb.from('mf_attendance').select('student_id,event_type,occurred_at').gte('occurred_at',start.toISOString()).order('occurred_at',{ascending:true});let latest={};(att||[]).forEach(a=>latest[a.student_id]=a);students=students.map(s=>({...s,present:latest[s.id]?.event_type==='in'}))}state.students=students}
async function updateUnreadBadge(){if(state.demo||!state.user)return;let {data,error}=await sb.from('mf_conversation_inbox').select('unread_count');if(error)return;let n=(data||[]).reduce((a,x)=>a+Number(x.unread_count||0),0);$('#msgBadge').textContent=n;$('#msgBadge').classList.toggle('hidden',n===0)}
function setupRealtime(){if(state.demo||!state.user)return;sb.channel('mf-chat-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'mf_chat_messages'},()=>{updateUnreadBadge();if(state.view==='messages'&&!state.selectedConversation)renderMessages()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'mf_announcements'},()=>{if(state.view==='messages'&&state.commTab==='announcements')renderMessages()}).subscribe()}
async function afterSession(session){state.user=session?.user||null;if(!state.user)return;let {data}=await sb.from('mf_profiles').select('*').eq('id',state.user.id).maybeSingle();state.profile=data||{role:'family',full_name:state.user.email};await loadData();$('#auth').classList.add('hidden');$('#userChip').textContent=(state.profile.full_name||state.user.email)+' · '+state.profile.role;$('#logoutBtn').classList.remove('hidden');await updateUnreadBadge();setupRealtime();switchView('home')}
async function login(){let {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent='';afterSession(data.session)}
async function signup(){let email=$('#email').value.trim(),password=$('#password').value;if(password.length<6){$('#authMsg').textContent='La contraseña debe tener al menos 6 caracteres.';return}let {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent=data.session?'Cuenta creada. Entrando...':'Cuenta creada. Revisa tu correo si se solicita confirmación.';if(data.session)afterSession(data.session)}
async function logout(){if(!state.demo)await sb.auth.signOut();state={demo:false,user:null,profile:null,students:[],view:'home',commTab:'inbox',selectedConversation:null};$('#auth').classList.remove('hidden');$('#logoutBtn').classList.add('hidden');$('#userChip').textContent='Sin sesión';$('#msgBadge').classList.add('hidden')}
$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#demoBtn').onclick=async()=>{state.demo=true;state.profile={role:'admin',full_name:'Demostración'};await loadData();$('#auth').classList.add('hidden');$('#userChip').textContent='Demo · Administrador';switchView('home')};$('#logoutBtn').onclick=logout;$$('.bottom button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};(async()=>{let {data}=await sb.auth.getSession();if(data.session)afterSession(data.session)})();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body></html>
