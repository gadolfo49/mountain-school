function openForm(action){let studentOptions=state.students.map(s=>`<option value="${s.id}">${fullName(s)}</option>`).join('');if(!studentOptions)studentOptions='<option value="">Sin estudiantes</option>';let title={meal:'Registrar comida',diaper:'Registrar pañal',nap:'Registrar siesta',activity:'Registrar actividad CRECE',incident:'Registrar incidencia',message:'Nuevo mensaje',newStudent:'Nuevo estudiante',safety:'Mountain Safety'}[action]||'Registro';let body='';if(action==='newStudent')body=`<div class="field"><label>Nombre</label><input id="fName"></div><div class="field"><label>Apellido</label><input id="fLast"></div><div class="field"><label>Nivel</label><select id="fLevel"><option>Infantes</option><option>Párvulos</option><option>Pre-Kinder</option><option>Kinder</option></select></div>`;else if(action==='safety')body=`<div class="field"><label>Protocolo</label><select id="fSafety"><option value="earthquake">Sismo</option><option value="fire">Incendio</option><option value="lockdown">Resguardo</option><option value="medical">Emergencia médica</option><option value="drill">Simulacro</option></select></div><div class="notice mt">Al activarlo, el personal podrá iniciar el conteo de estudiantes y actualizar estados de seguridad.</div>`;else body=`<div class="field"><label>Estudiante</label><select id="fStudent">${studentOptions}</select></div><div class="field"><label>Detalle</label><textarea id="fDetail" rows="4" placeholder="Escribe el detalle..."></textarea></div>${action==='activity'?'<div class="field"><label>Pilar CRECE</label><select id="fPillar"><option>Creatividad y Construcción</option><option>Ritmo y Movimiento</option><option>Exploración y Curiosidad</option><option>Conexión y Comunicación</option><option>Equilibrio y Autonomía</option></select></div>':''}`;$('#sheet').innerHTML=`<div class="head"><h3>${title}</h3><button class="btn soft" id="closeModal">Cerrar</button></div>${body}<button class="btn primary mt" id="saveForm">Guardar</button>`;$('#modal').classList.add('show');$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#saveForm').onclick=()=>saveForm(action)}
async function saveForm(action){if(state.demo){toast('Guardado en modo demostración');$('#modal').classList.remove('show');return}try{if(action==='newStudent'){let level=$('#fLevel').value;let {data:rooms}=await sb.from('mf_classrooms').select('id,level').eq('level',level).limit(1);let payload={first_name:$('#fName').value.trim(),last_name:$('#fLast').value.trim(),classroom_id:rooms?.[0]?.id||null};let {error}=await sb.from('mf_students').insert(payload);if(error)throw error;await loadData();renderHome()}else if(action==='safety'){let map={earthquake:'Sismo',fire:'Incendio',lockdown:'Resguardo',medical:'Emergencia médica',drill:'Simulacro'};let t=$('#fSafety').value;let {error}=await sb.from('mf_safety_events').insert({event_type:t,title:map[t],created_by:state.user.id});if(error)throw error}else if(action==='message'){let sid=$('#fStudent').value||null;let {error}=await sb.from('mf_messages').insert({student_id:sid,channel:'aula',body:$('#fDetail').value.trim()||'Mensaje',sender_id:state.user.id});if(error)throw error}else if(action==='incident'){let {error}=await sb.from('mf_incidents').insert({student_id:$('#fStudent').value,incident_type:'general',description:$('#fDetail').value.trim()||'Incidencia registrada',created_by:state.user.id});if(error)throw error}else{let types={meal:'meal',diaper:'diaper',nap:'nap',activity:'activity'};let {error}=await sb.from('mf_daily_events').insert({student_id:$('#fStudent').value,event_type:types[action],summary:$('#fDetail').value.trim()||titleFor(action),crece_pillar:action==='activity'?$('#fPillar').value:null,created_by:state.user.id});if(error)throw error}toast('Registro guardado');$('#modal').classList.remove('show')}catch(e){toast('No se pudo guardar: '+(e.message||'error'))}}
function titleFor(a){return ({meal:'Alimentación registrada',diaper:'Cambio de pañal registrado',nap:'Siesta registrada',activity:'Actividad registrada'})[a]}
function bindActions(){$$('[data-action]').forEach(b=>b.onclick=()=>openForm(b.dataset.action))}
async function loadData(){if(state.demo){state.students=demoStudents;return}let {data,error}=await sb.from('mf_students').select('id,first_name,last_name,uses_diaper,allergies,medications,food_restrictions,mf_classrooms(level)');state.students=error?[]:(data||[]).map(x=>({...x,level:x.mf_classrooms?.level,present:true}))}
async function afterSession(session){state.user=session?.user||null;if(!state.user)return;let {data}=await sb.from('mf_profiles').select('*').eq('id',state.user.id).maybeSingle();state.profile=data||{role:'family',full_name:state.user.email};await loadData();$('#auth').classList.add('hidden');$('#userChip').textContent=(state.profile.full_name||state.user.email)+' · '+state.profile.role;$('#logoutBtn').classList.remove('hidden');switchView('home')}
async function login(){let email=$('#email').value.trim(),password=$('#password').value;$('#authMsg').textContent='Conectando...';let {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent='';afterSession(data.session)}
async function signup(){let email=$('#email').value.trim(),password=$('#password').value;if(password.length<6){$('#authMsg').textContent='La contraseña debe tener al menos 6 caracteres.';return}let {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent=data.session?'Cuenta creada. Entrando...':'Cuenta creada. Revisa tu correo si Supabase solicita confirmación.';if(data.session)afterSession(data.session)}
async function logout(){if(!state.demo)await sb.auth.signOut();state={demo:false,user:null,profile:null,students:[],view:'home'};$('#auth').classList.remove('hidden');$('#logoutBtn').classList.add('hidden');$('#userChip').textContent='Sin sesión'}
$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#demoBtn').onclick=async()=>{state.demo=true;state.profile={role:'admin',full_name:'Demostración'};await loadData();$('#auth').classList.add('hidden');$('#userChip').textContent='Demo · Administrador';switchView('home')};$('#logoutBtn').onclick=logout;$$('.bottom button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};
(async()=>{let {data}=await sb.auth.getSession();if(data.session)afterSession(data.session)})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body></html>
