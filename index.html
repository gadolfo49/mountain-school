function mins(t){let p=t.split(':');return +p[0]*60 + +p[1]}

function initials(s){return `${(s.first_name||'?')[0]}${(s.last_name||'')[0]||''}`.toUpperCase()}
function studentList(){if(!state.students.length)return '<div class="notice">Todavía no hay estudiantes visibles para esta cuenta.</div>';return `<div class="list">${state.students.map(s=>`<div class="student"><div class="avatar">${initials(s)}</div><div><b>${fullName(s)}</b><small>${s.level||'Sin nivel'} · ${s.present?'Presente hoy':'Aún no ha registrado entrada hoy'}</small></div><span class="${s.present?'ok':'absent'}">${s.present?'✓':'Pend.'}</span></div>`).join('')}</div>`}

me').innerHTML=html;bindActions()}

function switchView(v){state.view=v;['home','routine','academic','messages','more'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==v));$$('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='home')renderHome();if(v==='routine')renderRoutine();if(v==='academic')renderAcademic();if(v==='messages')renderMessages();if(v==='more')renderMore()}
function classNames(){let names=[...new Set(state.students.map(s=>s.level).filter(Boolean))];return ['Infantes','Párvulos','Pre-Kinder','Kinder'].filter(x=>names.includes(x)).concat(names.filter(x=>!['Infantes','Párvulos','Pre-Kinder','Kinder'].includes(x)))}
function openBulk(){let classes=classNames();let initial=classes[0]||'Párvulos';$('#sheet').innerHTML=`<div class="head"><div><h3>Registro masivo por curso</h3><p>Un solo registro interno → comunicación individual para cada familia.</p></div><button class="btn soft" id="closeModal">Cerrar</button></div><div class="grid g2"><div class="field"><label>Curso</label><select id="bulkClass">${classes.map(c=>`<option${c===initial?' selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Momento general</label><select id="bulkMoment">${bulkMoments.map(m=>`<option value="${m.v}">${m.label}</option>`).join('')}</select></div></div><div class="field"><label>Nota adicional opcional</label><textarea id="bulkNote" rows="2" placeholder="Ej.: comió muy bien, actividad realizada sin novedades..."></textarea></div><div class="toolbar"><b style="font-size:11px">Selecciona los niños</b><div class="row"><button class="btn soft" id="selectPresent">Solo presentes</button><button class="btn soft" id="selectAll">Todos</button><button class="btn soft" id="clearAll">Ninguno</button></div></div><div id="bulkStudents" class="checklist"></div><div id="bulkPreview" class="preview"></div><button class="btn primary mt" id="saveBulk">Enviar registros personalizados</button>`;$('#modal').classList.add('show');$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#bulkClass').onchange=renderBulkStudents;$('#bulkMoment').onchange=renderBulkStudents;$('#bulkNote').oninput=updateBulkPreview;$('#selectPresent').onclick=()=>setBulkChecks('present');$('#selectAll').onclick=()=>setBulkChecks('all');$('#clearAll').onclick=()=>setBulkChecks('none');$('#saveBulk').onclick=saveBulk;renderBulkStudents()}
function renderBulkStudents(){let cls=$('#bulkClass').value,moment=bulkMoments.find(m=>m.v===$('#bulkMoment').value),students=state.students.filter(s=>s.level===cls);$('#bulkStudents').innerHTML=students.length?students.map(s=>{let checked=s.present&&(!moment.diaper||s.uses_diaper);return `<label class="checkrow"><input type="checkbox" class="bulkCheck" data-id="${s.id}" ${checked?'checked':''}><div><b>${fullName(s)}</b><small>${moment.diaper&&!s.uses_diaper?'No usa pañal · ':''}${s.present?'Entrada registrada hoy':'Aún no ha registrado entrada hoy'}</small></div><span class="badge ${s.present?'present':'notyet'}">${s.present?'PRESENTE':'NO HA LLEGADO'}</span></label>`}).join(''):'<div class="notice">No hay estudiantes en este curso.</div>';updateBulkPreview()}
function setBulkChecks(mode){$$('.bulkCheck').forEach(c=>{let s=state.students.find(x=>x.id===c.dataset.id),moment=bulkMoments.find(m=>m.v===$('#bulkMoment').value);c.checked=mode==='all'||(mode==='present'&&s?.present&&(!moment.diaper||s?.uses_diaper));if(mode==='none')c.checked=false});updateBulkPreview()}
function selectedBulkStudents(){let ids=$$('.bulkCheck:checked').map(c=>c.dataset.id);return state.students.filter(s=>ids.includes(String(s.id)))}
function updateBulkPreview(){let sel=selectedBulkStudents(),m=bulkMoments.find(x=>x.v===$('#bulkMoment').value),note=$('#bulkNote')?.value.trim();$('#bulkPreview').innerHTML=sel.length?`<b>${sel.length} comunicaciones individuales listas.</b><br>${sel.slice(0,3).map(s=>m.text(s.first_name)+(note?' '+note:'')).join('<br>')}${sel.length>3?'<br>…':''}`:'Selecciona al menos un estudiante. Por defecto se marcan únicamente quienes tienen entrada registrada hoy.'}
async function saveBulk(){let sel=selectedBulkStudents();if(!sel.length){toast('Selecciona al menos un estudiante');return}let m=bulkMoments.find(x=>x.v===$('#bulkMoment').value),cls=$('#bulkClass').value,note=$('#bulkNote').value.trim();if(state.demo){toast(`${sel.length} registros personalizados creados en demo`);$('#modal').classList.remove('show');return}let payload=sel.map(s=>({student_id:s.id,event_type:m.v,summary:m.text(s.first_name)+(note?' '+note:''),details:{bulk:true,classroom:cls,personalized:true,moment:m.label},visible_to_family:true,created_by:state.user.id}));let {error}=await sb.from('mf_daily_events').insert(payload);if(error){toast('No se pudo enviar: '+error.message);return}toast(`${sel.length} familias actualizadas`);$('#modal').classList.remove('show')}
function openForm(action){if(action==='bulk'){openBulk();return}let studentOptions=state.students.map(s=>`<option value="${s.id}">${fullName(s)}</option>`).join('')||'<option value="">Sin estudiantes</option>';let title={meal:'Registrar comida',diaper:'Registrar pañal',nap:'Registrar siesta',activity:'Registrar actividad CRECE',incident:'Registrar incidencia',message:'Nuevo mensaje',newStudent:'Nuevo estudiante',safety:'Mountain Safety'}[action]||'Registro';let body='';if(action==='newStudent')body=`<div class="field"><label>Nombre</label><input id="fName"></div><div class="field"><label>Apellido</label><input id="fLast"></div><div class="field"><label>Nivel</label><select id="fLevel"><option>Infantes</option><option>Párvulos</option><option>Pre-Kinder</option><option>Kinder</option></select></div>`;else if(action==='safety')body=`<div class="field"><label>Protocolo</label><select id="fSafety"><option value="earthquake">Sismo</option><option value="fire">Incendio</option><option value="lockdown">Resguardo</option><option value="medical">Emergencia médica</option><option value="drill">Simulacro</option></select></div>`;else body=`<div class="field"><label>Estudiante</label><select id="fStudent">${studentOptions}</select></div><div class="field"><label>Detalle</label><textarea id="fDetail" rows="4"></textarea></div>`;$('#sheet').innerHTML=`<div class="head"><h3>${title}</h3><button class="btn soft" id="closeModal">Cerrar</button></div>${body}<button class="btn primary mt" id="saveForm">Guardar</button>`;$('#modal').classList.add('show');$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#saveForm').onclick=()=>saveForm(action)}
async function saveForm(action){if(state.demo){toast('Guardado en modo demostración');$('#modal').classList.remove('show');return}try{if(action==='newStudent'){let level=$('#fLevel').value,{data:rooms}=await sb.from('mf_classrooms').select('id,level').eq('level',level).limit(1),{error}=await sb.from('mf_students').insert({first_name:$('#fName').value.trim(),last_name:$('#fLast').value.trim(),classroom_id:rooms?.[0]?.id||null});if(error)throw error;await loadData();renderHome()}else if(action==='safety'){let map={earthquake:'Sismo',fire:'Incendio',lockdown:'Resguardo',medical:'Emergencia médica',drill:'Simulacro'},t=$('#fSafety').value,{error}=await sb.from('mf_safety_events').insert({event_type:t,title:map[t],created_by:state.user.id});if(error)throw error}else if(action==='message'){let {error}=await sb.from('mf_messages').insert({student_id:$('#fStudent').value||null,channel:'aula',body:$('#fDetail').value.trim()||'Mensaje',sender_id:state.user.id});if(error)throw error}else if(action==='incident'){let {error}=await sb.from('mf_incidents').insert({student_id:$('#fStudent').value,incident_type:'general',description:$('#fDetail').value.trim()||'Incidencia registrada',created_by:state.user.id});if(error)throw error}else{let types={meal:'meal',diaper:'diaper',nap:'nap',activity:'activity'},{error}=await sb.from('mf_daily_events').insert({student_id:$('#fStudent').value,event_type:types[action],summary:$('#fDetail').value.trim()||'Registro realizado',visible_to_family:true,created_by:state.user.id});if(error)throw error}toast('Registro guardado');$('#modal').classList.remove('show')}catch(e){toast('No se pudo guardar: '+(e.message||'error'))}}
function bindActions(){$$('[data-action]').forEach(b=>b.onclick=()=>openForm(b.dataset.action))}
async function loadData(){if(state.demo){state.students=demoStudents;return}let {data,error}=await sb.from('mf_students').select('id,first_name,last_name,uses_diaper,allergies,medications,food_restrictions,mf_classrooms(level)');let students=error?[]:(data||[]).map(x=>({...x,level:x.mf_classrooms?.level||'Sin nivel',present:false}));if(students.length){let start=new Date();start.setHours(0,0,0,0);let {data:att}=await sb.from('mf_attendance').select('student_id,event_type,occurred_at').gte('occurred_at',start.toISOString()).order('occurred_at',{ascending:true});let latest={};(att||[]).forEach(a=>latest[a.student_id]=a);students=students.map(s=>({...s,present:latest[s.id]?.event_type==='in'}))}state.students=students}
async function afterSession(session){state.user=session?.user||null;if(!state.user)return;let {data}=await sb.from('mf_profiles').select('*').eq('id',state.user.id).maybeSingle();state.profile=data||{role:'family',full_name:state.user.email};await loadData();$('#auth').classList.add('hidden');$('#userChip').textContent=(state.profile.full_name||state.user.email)+' · '+state.profile.role;$('#logoutBtn').classList.remove('hidden');switchView('home')}
async function login(){let email=$('#email').value.trim(),password=$('#password').value;$('#authMsg').textContent='Conectando...';let {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent='';afterSession(data.session)}
async function signup(){let email=$('#email').value.trim(),password=$('#password').value;if(password.length<6){$('#authMsg').textContent='La contraseña debe tener al menos 6 caracteres.';return}let {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent=data.session?'Cuenta creada. Entrando...':'Cuenta creada. Revisa tu correo si se solicita confirmación.';if(data.session)afterSession(data.session)}
async function logout(){if(!state.demo)await sb.auth.signOut();state={demo:false,user:null,profile:null,students:[],view:'home'};$('#auth').classList.remove('hidden');$('#logoutBtn').classList.add('hidden');$('#userChip').textContent='Sin sesión'}
$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#demoBtn').onclick=async()=>{state.demo=true;state.profile={role:'admin',full_name:'Demostración'};await loadData();$('#auth').classList.add('hidden');$('#userChip').textContent='Demo · Administrador';switchView('home')};$('#logoutBtn').onclick=logout;$$('.bottom button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};(async()=>{let {data}=await sb.auth.getSession();if(data.session)afterSession(data.session)})();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body></html>
