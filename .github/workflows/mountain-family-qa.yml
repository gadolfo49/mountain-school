name: Mountain Family QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run protected integration, security, accessibility, audience and Mounty text-assist contracts
        run: node --test tests/*.test.mjs
      - name: Wait for GitHub Pages deployment
        run: sleep 55
      - name: Run R5.6 live deployment and browser smoke tests
        run: bash tests/live-smoke.sh
